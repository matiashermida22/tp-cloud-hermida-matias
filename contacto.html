<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - CloudStudy</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="logo">Cloud<span>Study</span></div>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="conceptos.html">Conceptos</a>
            <a href="contacto.html" class="active">Contacto</a>
        </nav>
    </header>

    <main>
        <div class="container">
            <h1 class="page-title">Contacto</h1>
            <p class="subtitle">Dejanos tu consulta (formulario de ejemplo, sin envío real).</p>

            <form onsubmit="event.preventDefault(); alert('¡Gracias! Este formulario es solo de demostración.');">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <label for="tema">Tema</label>
                <select id="tema" name="tema">
                    <option>IaaS</option>
                    <option>PaaS</option>
                    <option>SaaS</option>
                    <option>Terraform / Docker</option>
                </select>

                <label for="mensaje">Mensaje</label>
                <textarea id="mensaje" name="mensaje" rows="5" required></textarea>

                <button type="submit">Enviar</button>
            </form>
        </div>
    </main>

    <footer>&copy; 2026 CloudStudy - Trabajo práctico de Cloud Computing</footer>
</body>
</html>
